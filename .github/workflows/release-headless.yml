name: Release (Headless Tarballs)

# Builds the bare-metal headless tarballs (x64 + arm64/Raspberry Pi) and
# attaches them to the GitHub Release. Runs on the same `v*` tag push as
# build.yml (Windows/macOS/Linux installers) and docker-publish.yml (Docker
# image), so a single `git push origin vX.Y.Z` produces the whole release.
# Each of those workflows attaches its own assets to the same release via
# softprops/action-gh-release, which creates the release if missing and
# otherwise appends.
#
# workflow_dispatch is for re-running just the tarballs (e.g. after a
# failed job) against an existing tag.
#
# glibc floor is 2.39 (Ubuntu 24.04) project-wide. x64 is built in
# scripts/Containerfile.x64-builder (ubuntu:24.04); arm64 in
# scripts/Containerfile.arm64-builder (debian:12, so it in practice needs
# only glibc 2.36, comfortably under the 2.39 ceiling enforced below).
# The arm64 job runs natively on GitHub's free `ubuntu-24.04-arm` runner
# (public repos only) — no QEMU emulation, unlike a local build.
#
# Requires the HAMLIB_RCW_TOKEN repo secret (private hamlib-RCW clone for
# the arm64 rigctld build), same as build.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.5.0 (must match package.json "version"; tag vX.Y.Z is created if missing)'
        required: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  headless-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and verify version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Release version '$VERSION' does not match package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build x64 headless tarball
        run: bash scripts/build-headless-x64.sh

      - name: Smoke test x64 tarball
        run: bash scripts/test-headless-x64.sh dist-headless-x64/*.tar.gz

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: dist-headless-x64/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  headless-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and verify version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Release version '$VERSION' does not match package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The build/test scripts are podman-only (podman's --arch flag); it is
      # usually preinstalled on GitHub's Ubuntu images, this covers the case
      # where it is not.
      - name: Ensure podman is installed
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version
          uname -m

      - name: Build arm64 headless tarball
        env:
          HAMLIB_RCW_TOKEN: ${{ secrets.HAMLIB_RCW_TOKEN }}
        run: bash scripts/build-headless-arm64.sh

      # Guards the project-wide glibc 2.39 floor, mirroring build.yml's
      # rigctld check and build-headless-x64.sh's check.
      - name: Verify arm64 glibc floor
        run: |
          mkdir -p "$RUNNER_TEMP/chk"
          tar xzf dist-headless-arm64/*.tar.gz -C "$RUNNER_TEMP/chk"
          FAIL=0
          while IFS= read -r f; do
            MAX=$(objdump -T "$f" 2>/dev/null | grep -oP 'GLIBC_\K[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
            [ -z "$MAX" ] && continue
            if [ "$(printf '%s\n2.39\n' "$MAX" | sort -V | tail -1)" != "2.39" ]; then
              echo "::error::$f requires glibc $MAX, newer than the project floor (glibc 2.39)"
              FAIL=1
            fi
          done < <(find "$RUNNER_TEMP/chk" \( -path '*/bin/linux/*' -o -name '*.node' \) -type f)
          exit $FAIL

      - name: Smoke test arm64 tarball
        run: bash scripts/test-headless-arm64.sh dist-headless-arm64/*.tar.gz

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: dist-headless-arm64/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
