name: Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Scoped to release tag pushes only — same trigger as build.yml's real
# release path — so this suite (and its ~10min e2e job) doesn't run on every
# commit pushed to main or on manual/non-release electron builds
# (workflow_dispatch). This workflow is a signal only — it does not gate
# anything automatically. The real release gate is the manual pre-release
# checklist in CLAUDE.md (this suite + the FT4222 hardware suite + the Linux
# packaging smoke test), run by hand before tagging a release.
#
# Hardware-dependent tests (FT4222/FT-710) are intentionally NOT run here —
# no CI runner has a physical FT-710 attached. See `npm run test:hardware`,
# run manually/locally with the radio connected.
#
# Pinned to ubuntu-24.04 (not ubuntu-latest) so that IF `bin/linux/rigctld`
# (or the CW/FT4222/WSJTX-bridge helpers, which build.yml compiles fresh
# every release rather than reusing a committed binary) is ever rebuilt in
# CI, it's baselined against this project's documented glibc floor rather
# than whatever Ubuntu "latest" happens to roll to. This is what caught a
# real bug: a locally-rebuilt bin/linux/rigctld required a newer glibc than
# Ubuntu 24.04 ships, breaking here before it could ship in a release.

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev

      - name: Install dependencies
        run: npm ci

      # Fails fast, before anything expensive (npm ci already ran, but
      # Playwright install/e2e tests haven't) if the committed bin/linux/
      # rigctld was rebuilt on a machine with a newer glibc than this
      # project's floor (Ubuntu 24.04, glibc 2.39) and re-committed without
      # checking — this exact mistake broke CI once already.
      - name: Verify bin/linux/rigctld's glibc floor
        run: |
          MAX_GLIBC=$(objdump -T bin/linux/rigctld | grep -oP 'GLIBC_\K[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "bin/linux/rigctld requires glibc <= $MAX_GLIBC"
          MAJOR=$(echo "$MAX_GLIBC" | cut -d. -f1)
          MINOR=$(echo "$MAX_GLIBC" | cut -d. -f2)
          if [ "$MAJOR" -gt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -gt 39 ]; }; then
            echo "::error::bin/linux/rigctld requires glibc $MAX_GLIBC, newer than this project's floor (Ubuntu 24.04, glibc 2.39). Rebuild it in an 'ubuntu:24.04' container (see scripts/build-rigctld.mjs) before committing."
            exit 1
          fi

      # The bundled bin/linux/rigctld is normally reused as-is (see the
      # glibc-floor check above) — this only actually builds from source if
      # the binary is ever missing from the checkout.
      - name: Build rigctld
        run: node scripts/build-rigctld.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # AudioFeedPanel/CwDecodePanel/SpectrumAudioPanel e2e coverage needs
      # naudiodon (server/audio.ts) to open a real audio device — see
      # tests/fixtures/audio-loopback.ts for the PipeWire pw-loopback +
      # wpctl (WirePlumber's own CLI) setup this relies on. No PulseAudio
      # server/pactl involved; libpulse0 is only needed because naudiodon's
      # bundled PortAudio dynamically links libpulse.so.0 at import time
      # (confirmed via ldd) even though the ALSA/PipeWire path is what's
      # actually used. Backgrounded manually with an explicit
      # XDG_RUNTIME_DIR rather than `systemctl --user start` — GH Actions
      # runners aren't guaranteed a full login/D-Bus session. This must run
      # before "Run e2e tests" (which spawns the app server via
      # playwright.config.ts's webServer) since initAudioEngine() only runs
      # once at server boot.
      #
      # A private D-Bus session bus is still required, though: WirePlumber's
      # module-rt (rtkit) and spa.dbus modules try to connect to one at
      # startup regardless of how it's launched, and without one it logs
      # "Cannot autolaunch D-Bus without X11 $DISPLAY" and disconnects from
      # PipeWire entirely — confirmed via CI logs: the `wpctl status` below
      # still "succeeds" in that case (wpctl can talk to bare PipeWire
      # directly), but shows no real Sources/Sinks, only PipeWire's
      # synthetic "Dummy Output" fallback, so any node pw-loopback creates
      # later never appears (not a timing issue — nothing is managing/
      # exposing it). `dbus-daemon --session --fork --print-address` starts
      # one that outlives this step for the rest of the job, same as the
      # daemons below.
      - name: Install and start PipeWire virtual audio stack
        run: |
          sudo apt-get install -y pipewire pipewire-pulse pipewire-alsa wireplumber dbus libpulse0
          mkdir -p /tmp/xdg-runtime
          chmod 700 /tmp/xdg-runtime
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --fork --print-address)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS
          pipewire &
          disown
          sleep 1
          pipewire-pulse &
          disown
          wireplumber &
          disown
          sleep 2
          wpctl status

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
